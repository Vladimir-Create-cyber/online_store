services:
  vite:
    image: node:20-alpine
    container_name: online_store_vite
    working_dir: /var/www/html
    command: sh -c "npm install && npm run dev"
    ports:
      - "5173:5173"
    environment:
      VITE_HMR_HOST: localhost
    volumes:
      - ./:/var/www/html
      - /var/www/html/node_modules
    depends_on:
      - app
    networks:
      - online_store
