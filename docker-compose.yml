services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: online_store_app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: online_store
      DB_USERNAME: online_store
      DB_PASSWORD: secret
    volumes:
      - ./:/var/www/html
      - /var/www/html/vendor
      - /var/www/html/node_modules
    depends_on:
      - mysql
    networks:
      - online_store

  nginx:
    image: nginx:1.27-alpine
    container_name: online_store_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - online_store

  mysql:
    image: mysql:8.4
    container_name: online_store_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: online_store
      MYSQL_USER: online_store
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - online_store

volumes:
  mysql_data:

networks:
  online_store:
    driver: bridge
